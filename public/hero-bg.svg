<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFE0FB"/>
      <stop offset="55%" stop-color="#E4F2FC"/>
      <stop offset="100%" stop-color="#F7FBFE"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFEBB0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFEBB0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDEBD6"/>
      <stop offset="100%" stop-color="#BEE6CB"/>
    </linearGradient>
    <linearGradient id="lawnNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9DEBB"/>
      <stop offset="100%" stop-color="#8FD4A7"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F4"/>
      <stop offset="100%" stop-color="#DCE6E2"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCEBFC"/>
      <stop offset="100%" stop-color="#9FC7F2"/>
    </linearGradient>
    <linearGradient id="glassB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF3FE"/>
      <stop offset="100%" stop-color="#BBDAFA"/>
    </linearGradient>
    <linearGradient id="buildingBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF0F5"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0B1B3A" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#0B1B3A" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#081633" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#06142C" stop-opacity="0.28"/>
      <stop offset="18%" stop-color="#06142C" stop-opacity="0"/>
      <stop offset="82%" stop-color="#06142C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#06142C" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1540" cy="230" r="260" fill="url(#sun)"/>
  <circle cx="1540" cy="230" r="70" fill="#FFF9E8" opacity="0.9"/>

  <!-- CLOUDS -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="280" cy="180" rx="110" ry="30"/>
    <ellipse cx="360" cy="165" rx="80" ry="26"/>
    <ellipse cx="210" cy="165" rx="70" ry="22"/>

    <ellipse cx="900" cy="120" rx="95" ry="24"/>
    <ellipse cx="965" cy="110" rx="65" ry="20"/>

    <ellipse cx="1720" cy="150" rx="90" ry="24"/>
    <ellipse cx="1780" cy="140" rx="60" ry="18"/>
  </g>

  <!-- DISTANT SKYLINE (soft, low contrast, gives depth) -->
  <g fill="#CBDCEE" opacity="0.55">
    <rect x="60"  y="470" width="90"  height="180" rx="4"/>
    <rect x="170" y="500" width="60"  height="150" rx="4"/>
    <rect x="1650" y="480" width="80" height="170" rx="4"/>
    <rect x="1750" y="510" width="55" height="140" rx="4"/>
  </g>

  <!-- FAR LAWN -->
  <rect x="0" y="600" width="1920" height="140" fill="url(#lawnFar)"/>

  <!-- ============ LEFT BUILDING (large glass academic block) ============ -->
  <g>
    <rect x="30" y="380" width="430" height="330" rx="6" fill="url(#buildingBody)"/>
    <rect x="30" y="380" width="430" height="14" fill="#DCE6EE"/>
    <!-- glass grid -->
    <g fill="url(#glassA)">
      <rect x="55"  y="415" width="70" height="90" rx="3"/>
      <rect x="140" y="415" width="70" height="90" rx="3"/>
      <rect x="225" y="415" width="70" height="90" rx="3"/>
      <rect x="310" y="415" width="70" height="90" rx="3"/>
      <rect x="395" y="415" width="45" height="90" rx="3"/>

      <rect x="55"  y="525" width="70" height="90" rx="3"/>
      <rect x="140" y="525" width="70" height="90" rx="3"/>
      <rect x="225" y="525" width="70" height="90" rx="3"/>
      <rect x="310" y="525" width="70" height="90" rx="3"/>
      <rect x="395" y="525" width="45" height="90" rx="3"/>
    </g>
    <!-- entrance -->
    <rect x="185" y="635" width="120" height="75" fill="#2563EB" opacity="0.85" rx="3"/>
    <rect x="205" y="635" width="1" height="75" fill="#FFFFFF" opacity="0.5"/>
    <rect x="245" y="635" width="1" height="75" fill="#FFFFFF" opacity="0.5"/>
    <rect x="285" y="635" width="1" height="75" fill="#FFFFFF" opacity="0.5"/>
    <!-- flagpole -->
    <rect x="440" y="330" width="4" height="60" fill="#8CA0AE"/>
    <path d="M444 332 L490 344 L444 356 Z" fill="#22C55E"/>
  </g>

  <!-- ============ RIGHT BUILDING (glass pavilion, slightly set back) ============ -->
  <g>
    <rect x="1450" y="420" width="360" height="290" rx="6" fill="url(#buildingBody)"/>
    <rect x="1450" y="420" width="360" height="12" fill="#DCE6EE"/>
    <g fill="url(#glassB)">
      <rect x="1472" y="452" width="60" height="80" rx="3"/>
      <rect x="1546" y="452" width="60" height="80" rx="3"/>
      <rect x="1620" y="452" width="60" height="80" rx="3"/>
      <rect x="1694" y="452" width="60" height="80" rx="3"/>

      <rect x="1472" y="548" width="60" height="80" rx="3"/>
      <rect x="1546" y="548" width="60" height="80" rx="3"/>
      <rect x="1620" y="548" width="60" height="80" rx="3"/>
      <rect x="1694" y="548" width="60" height="80" rx="3"/>
    </g>
    <rect x="1590" y="640" width="90" height="70" fill="#2563EB" opacity="0.85" rx="3"/>
  </g>

  <!-- small distant building centered on the horizon, framed by the pathway -->
  <g opacity="0.9">
    <rect x="860" y="470" width="200" height="130" rx="4" fill="url(#buildingBody)"/>
    <g fill="url(#glassA)">
      <rect x="878" y="490" width="40" height="45" rx="2"/>
      <rect x="928" y="490" width="40" height="45" rx="2"/>
      <rect x="978" y="490" width="40" height="45" rx="2"/>
      <rect x="1002" y="490" width="0" height="0"/>
    </g>
    <path d="M860 470 L960 435 L1060 470 Z" fill="#DCE6EE"/>
    <rect x="955" y="405" width="6" height="35" fill="#8CA0AE"/>
    <path d="M961 407 L995 417 L961 427 Z" fill="#60A5FA"/>
  </g>

  <!-- NEAR LAWN -->
  <path d="M0,730 C 260,690 470,700 720,715 C 860,722 1060,722 1200,715 C 1450,700 1660,690 1920,730 L1920,1080 L0,1080 Z" fill="url(#lawnNear)"/>

  <!-- PATHWAY (perspective, converges toward the distant building) -->
  <path d="M 790,1080 L 870,650 L 1050,650 L 1130,1080 Z" fill="url(#path)"/>
  <path d="M 830,900 L 1090,900" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="6" stroke-dasharray="26 22"/>
  <path d="M 855,760 L 1065,760" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="4" stroke-dasharray="18 16"/>

  <!-- flower beds flanking the path -->
  <g>
    <ellipse cx="760" cy="960" rx="70" ry="18" fill="#DFF3E6"/>
    <g fill="#22C55E" opacity="0.9">
      <circle cx="730" cy="958" r="6"/><circle cx="748" cy="954" r="6"/><circle cx="766" cy="960" r="6"/><circle cx="784" cy="955" r="6"/><circle cx="800" cy="962" r="6"/>
    </g>
    <ellipse cx="1160" cy="960" rx="70" ry="18" fill="#DFF3E6"/>
    <g fill="#60A5FA" opacity="0.9">
      <circle cx="1130" cy="958" r="6"/><circle cx="1148" cy="954" r="6"/><circle cx="1166" cy="960" r="6"/><circle cx="1184" cy="955" r="6"/><circle cx="1200" cy="962" r="6"/>
    </g>
  </g>

  <!-- TREES (kept to the outer thirds so the middle stays clean) -->
  <g id="treeCluster">
    <g transform="translate(560,760)">
      <rect x="-6" y="30" width="12" height="60" fill="#8B6A4C"/>
      <circle cx="0" cy="10" r="52" fill="#7FCB93"/>
      <circle cx="-38" cy="30" r="38" fill="#8FD4A2"/>
      <circle cx="40" cy="28" r="40" fill="#8FD4A2"/>
    </g>
    <g transform="translate(1370,770) scale(0.85)">
      <rect x="-6" y="30" width="12" height="60" fill="#8B6A4C"/>
      <circle cx="0" cy="10" r="52" fill="#7FCB93"/>
      <circle cx="-38" cy="30" r="38" fill="#8FD4A2"/>
      <circle cx="40" cy="28" r="40" fill="#8FD4A2"/>
    </g>
    <g transform="translate(260,860) scale(1.15)">
      <rect x="-7" y="34" width="14" height="66" fill="#8B6A4C"/>
      <circle cx="0" cy="12" r="58" fill="#6FC088"/>
      <circle cx="-42" cy="34" r="42" fill="#7FCB93"/>
      <circle cx="46" cy="32" r="44" fill="#7FCB93"/>
    </g>
    <g transform="translate(1660,870) scale(1.1)">
      <rect x="-7" y="34" width="14" height="66" fill="#8B6A4C"/>
      <circle cx="0" cy="12" r="58" fill="#6FC088"/>
      <circle cx="-42" cy="34" r="42" fill="#7FCB93"/>
      <circle cx="46" cy="32" r="44" fill="#7FCB93"/>
    </g>
  </g>

  <!-- STREET LAMPS flanking the path -->
  <g fill="#5B6B72">
    <g transform="translate(680,700)">
      <rect x="-3" y="0" width="6" height="130" rx="2"/>
      <circle cx="0" cy="-6" r="11" fill="#FFE9A8"/>
      <circle cx="0" cy="-6" r="18" fill="#FFE9A8" opacity="0.35"/>
    </g>
    <g transform="translate(1250,700)">
      <rect x="-3" y="0" width="6" height="130" rx="2"/>
      <circle cx="0" cy="-6" r="11" fill="#FFE9A8"/>
      <circle cx="0" cy="-6" r="18" fill="#FFE9A8" opacity="0.35"/>
    </g>
  </g>

  <!-- BENCHES -->
  <g fill="#6B7A82">
    <g transform="translate(600,930)">
      <rect x="0" y="10" width="90" height="8" rx="2"/>
      <rect x="0" y="-14" width="90" height="8" rx="2"/>
      <rect x="4" y="18" width="8" height="20"/>
      <rect x="78" y="18" width="8" height="20"/>
    </g>
    <g transform="translate(1320,930)">
      <rect x="0" y="10" width="90" height="8" rx="2"/>
      <rect x="0" y="-14" width="90" height="8" rx="2"/>
      <rect x="4" y="18" width="8" height="20"/>
      <rect x="78" y="18" width="8" height="20"/>
    </g>
  </g>

  <!-- STUDENTS (simple flat silhouettes, kept out of the center text zone) -->
  <g id="students">
    <!-- walking, backpack, left side -->
    <g transform="translate(500,880)">
      <circle cx="0" cy="-58" r="12" fill="#2563EB"/>
      <rect x="-11" y="-46" width="22" height="42" rx="8" fill="#2563EB"/>
      <rect x="4" y="-40" width="12" height="22" rx="5" fill="#1D4ED8"/>
      <rect x="-13" y="-8" width="10" height="34" rx="4" fill="#0B1B3A" opacity="0.85"/>
      <rect x="3" y="-8" width="10" height="34" rx="4" fill="#0B1B3A" opacity="0.85"/>
    </g>
    <!-- student on laptop, sitting near bench, right side -->
    <g transform="translate(1420,950)">
      <circle cx="0" cy="-30" r="11" fill="#22C55E"/>
      <rect x="-10" y="-19" width="20" height="26" rx="7" fill="#22C55E"/>
      <rect x="-16" y="4" width="34" height="6" rx="2" fill="#3E4A50"/>
      <rect x="-4" y="-2" width="18" height="10" rx="2" fill="#EAF3FE"/>
    </g>
    <!-- two students talking, right-of-center -->
    <g transform="translate(1180,890)">
      <circle cx="0" cy="-54" r="11" fill="#60A5FA"/>
      <rect x="-10" y="-43" width="20" height="38" rx="7" fill="#60A5FA"/>
      <rect x="-12" y="-6" width="9" height="30" rx="4" fill="#0B1B3A" opacity="0.85"/>
      <rect x="3" y="-6" width="9" height="30" rx="4" fill="#0B1B3A" opacity="0.85"/>
    </g>
    <g transform="translate(1215,900)">
      <circle cx="0" cy="-50" r="10" fill="#F59E0B" opacity="0.9"/>
      <rect x="-9" y="-40" width="18" height="34" rx="6" fill="#F59E0B" opacity="0.9"/>
      <rect x="-11" y="-6" width="8" height="28" rx="4" fill="#0B1B3A" opacity="0.8"/>
      <rect x="3" y="-6" width="8" height="28" rx="4" fill="#0B1B3A" opacity="0.8"/>
    </g>
    <!-- distant student walking toward the small building -->
    <g transform="translate(940,660) scale(0.55)">
      <circle cx="0" cy="-50" r="11" fill="#2563EB"/>
      <rect x="-10" y="-40" width="20" height="34" rx="7" fill="#2563EB"/>
      <rect x="-12" y="-6" width="9" height="26" rx="4" fill="#0B1B3A" opacity="0.7"/>
      <rect x="3" y="-6" width="9" height="26" rx="4" fill="#0B1B3A" opacity="0.7"/>
    </g>
  </g>

  <!-- soft ground shadow under the near lawn/path meeting line for depth -->
  <rect x="0" y="720" width="1920" height="10" fill="#164B2C" opacity="0.06"/>

  <!-- READABILITY OVERLAY: subtle dark-blue gradient (~40-50%) + gentle side vignette -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#overlay)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#vignette)"/>
</svg>
